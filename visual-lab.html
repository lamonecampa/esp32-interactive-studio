<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32 Visual Programming Studio</title>
<script src="https://cdn.jsdelivr.net/npm/blockly@11.2.2/blockly_compressed.js"></script><script src="https://cdn.jsdelivr.net/npm/blockly@11.2.2/blocks_compressed.js"></script><script src="https://cdn.jsdelivr.net/npm/blockly@11.2.2/msg/en.js"></script>
<style>
:root{--blue:#5689ed;--bg:#eaf1ff;--ink:#24334b;--line:#d4deed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,system-ui,Arial;overflow:hidden}
.top{height:50px;background:#5689ed;color:white;display:flex;align-items:center;gap:12px;padding:0 14px}.logo{font-weight:950;font-size:19px}.top .spacer{flex:1}.top a{color:white;text-decoration:none;font-weight:700}.top button{background:#ffffff20;color:white;border:1px solid #ffffff55;border-radius:7px;padding:7px 12px}
.toolbar{height:43px;display:flex;align-items:center;gap:7px;padding:5px 12px;background:#e6efff;border-bottom:1px solid #cbd8ef}.toolbar button,button{cursor:pointer;border:1px solid #cbd7e8;background:#fff;color:#34435a;border-radius:7px;padding:7px 11px;font-weight:650}.toolbar .primary{color:#23854c}.status{font-size:11px;color:#71819a;margin-left:auto}
.workspace-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(370px,1fr);gap:8px;padding:7px;height:calc(100vh - 93px);min-height:480px}.editor{background:#fff;border:1px solid #ccd7e9;overflow:hidden;min-width:0}.editor-head{display:none}#blocklyDiv{height:100%;width:100%}
.right{display:grid;grid-template-rows:minmax(300px,1fr) 188px;gap:8px;min-height:0}.stage,.sprites{background:#fff;border:1px solid #ccd7e9;overflow:hidden;min-height:0}.side-head{height:35px;padding:8px 11px;border-bottom:1px solid #e2e8f2;font-weight:750;display:flex;justify-content:space-between;align-items:center}.side-head span{font-size:11px;color:#71819a;font-weight:500}.stage-body{height:calc(100% - 35px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff;gap:8px;position:relative}.stage-controls{position:absolute;top:7px;left:8px;display:flex;gap:6px}.stage-controls button{font-size:11px;padding:5px 8px}.stage-art{width:100%;height:calc(100% - 45px);display:flex;align-items:center;justify-content:space-evenly;overflow:hidden}.sun{width:115px;height:115px;border-radius:50%;background:radial-gradient(circle,#fff7a8 0,#ffdf4f 42%,#f6b82e 70%);box-shadow:0 0 0 12px #ffe16a55,0 0 28px #ffd94c;position:relative;flex-shrink:0}.sun:before{content:'✳';position:absolute;inset:-35px;display:grid;place-items:center;font-size:180px;color:#f5d94e;z-index:0}.sun:after{content:'';position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5a2,#ffc42d 70%)}.cat{width:140px;height:155px;flex-shrink:0}.stage-caption{font-size:11px;color:#71819a;margin-top:-8px}
.sprites{display:grid;grid-template-rows:35px 1fr}.sprite-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:9px;border-bottom:1px solid #e2e8f2;font-size:11px}.sprite-info input{width:55px;border:1px solid #d5dfed;border-radius:12px;padding:4px;text-align:center}.sprite-bottom{display:flex;gap:8px;align-items:center;padding:8px;overflow:auto;background:#edf4ff}.sprite-card{min-width:70px;height:67px;border:1px solid #d0dced;background:#f8fbff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:10px;gap:3px}.sprite-card.active{border:2px solid #5689ed;background:#dce9ff}.sprite-card svg{width:34px;height:35px}.sprite-card .mini-sun{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff4a0,#ffca28);box-shadow:0 0 12px #ffdf55}
.blocklyToolboxDiv{background:#f7f9fd!important;border-right:1px solid #d8e1ef}.blocklyTreeLabel{font:600 12px Inter,Arial!important}.blocklyMainBackground{stroke:none!important}.blocklyFlyoutBackground{fill:#f7f9ff!important}.blocklyText{font-family:Inter,Arial!important;font-weight:600}.blocklySvg{background:#fff}.blocklyTreeRow{height:42px!important;margin-bottom:2px}.blocklyTreeIcon{display:none}.blocklyTreeLabel{line-height:42px!important}
.code-drawer{position:fixed;left:10px;right:10px;bottom:10px;height:260px;background:#fff;border:1px solid #bdcce2;box-shadow:0 8px 35px #1c315044;z-index:20;display:none;grid-template-rows:38px 1fr 42px}.code-drawer.open{display:grid}.code-drawer .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #dce5f1;font-weight:750}.code-drawer pre{margin:0;padding:12px;overflow:auto;background:#101b2b;color:#d6e7ff;font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre}.code-actions{padding:7px;display:flex;gap:7px;border-top:1px solid #dce5f1}.code-actions button{font-size:11px}
@media(max-width:850px){body{overflow:auto}.workspace-grid{grid-template-columns:1fr;height:auto}.editor{height:560px}.right{grid-template-rows:330px 190px}.code-drawer{left:4px;right:4px;height:240px}}
</style></head><body>
<header class="top"><div class="logo">🟠 ESP32</div><span>🌐 ▾</span><button>File</button><button>Edit</button><button>☀ Tutorials</button><button>🧩 Visual Blocks</button><div class="spacer"></div><a href="index.html">Learning Studio ↗</a></header>
<nav class="toolbar"><button class="primary" id="run">▶ Jalankan</button><button id="stop">⏹</button><button id="reset">↺ Reset</button><button id="example">Contoh LED Blink</button><button id="toggleCode">{ } Arduino C++</button><div class="status" id="status">Workspace siap</div></nav>
<div class="workspace-grid"><section class="editor"><div id="blocklyDiv"></div></section>
<aside class="right"><section class="stage"><div class="side-head">Stage <span id="boardState">LED OFF · ESP32 GPIO 2</span></div><div class="stage-body"><div class="stage-controls"><button id="stageGreen">🟢</button><button id="stageStop">🔴</button></div><div class="stage-art"><div class="sun"></div><svg class="cat" viewBox="0 0 150 160" aria-label="ESP32 mascot"><g stroke="#202b3b" stroke-width="4" stroke-linejoin="round"><path fill="#f6a928" d="M42 45 34 12 62 31 Q83 20 105 39 L127 23 122 61 Q141 89 120 119 Q91 145 58 126 Q29 112 35 79Z"/><path fill="#fff" d="M54 54 Q70 39 81 60 Q82 78 65 81 Q48 76 54 54M91 54 Q108 42 115 61 Q116 78 99 80 Q84 75 91 54"/><circle cx="68" cy="64" r="5" fill="#202b3b"/><circle cx="103" cy="64" r="5" fill="#202b3b"/><path fill="#fff" d="M70 91 Q88 106 107 88 Q100 119 82 114 Q70 108 70 91Z"/><path fill="#f6a928" d="M44 111 Q24 131 40 142 L58 135 65 119M104 117 Q126 128 137 115 L145 124 Q130 150 105 138Z"/></g></svg></div><div class="stage-caption" id="stageCaption">Virtual ESP32 stage · simulasi visual GPIO</div></div></section>
<section class="sprites"><div class="side-head">Sprite <span>Properties · Stage</span></div><div><div class="sprite-info"><div>Sprite <input value="ESP32 LED" aria-label="Sprite name"></div><div>↔ x <input value="0" aria-label="x position"></div><div>↕ y <input value="0" aria-label="y position"></div></div><div class="sprite-bottom"><div class="sprite-card active"><svg viewBox="0 0 40 40"><rect x="6" y="8" width="28" height="24" rx="5" fill="#284b72"/><circle cx="20" cy="20" r="7" fill="#ffe15b"/></svg>ESP32 Board</div><div class="sprite-card"><div class="mini-sun"></div>LED Output</div><div class="sprite-card"><svg viewBox="0 0 40 40"><path d="M8 28 11 8 20 15 30 8 33 29 20 35Z" fill="#f4a52b" stroke="#24334b" stroke-width="2"/><circle cx="16" cy="23" r="2"/><circle cx="25" cy="23" r="2"/></svg>Sensor</div><div class="sprite-card"><span style="font-size:25px">＋</span>Add Sprite</div></div></div></section></aside></div>
<section class="code-drawer" id="codeDrawer"><div class="drawer-head">Arduino C++ · Generated automatically <button id="closeCode">✕ Tutup</button></div><pre id="cpp">// Susun blok untuk menghasilkan kode...</pre><div class="code-actions"><button id="copy">Salin kode</button><button id="download">Unduh .ino</button><span class="status" id="genStatus">0 blok</span></div></section>
<xml id="toolbox" style="display:none">
<category name="Events" colour="#e5a52d"><block type="esp32_setup"></block><block type="esp32_loop"></block></category>
<category name="Control" colour="#e5a52d"><block type="esp32_delay"></block><block type="esp32_repeat"><value name="TIMES"><shadow type="math_number"><field name="NUM">5</field></shadow></value></block><block type="esp32_if"></block></category>
<category name="Logic" categorystyle="logic_category"><block type="controls_if"></block><block type="logic_compare"></block><block type="logic_boolean"></block><block type="logic_operation"></block><block type="logic_negate"></block></category>
<category name="Math" categorystyle="math_category"><block type="math_number"></block><block type="math_arithmetic"></block></category>
<category name="Variables" custom="VARIABLE" categorystyle="variable_category"></category>
<category name="GPIO" colour="#4c9bdb"><block type="esp32_pinmode"></block><block type="esp32_digital_write"></block><block type="esp32_digital_read"></block></category>
<category name="Sensors" colour="#48a66a"><block type="esp32_analog_read"></block></category>
<category name="Serial" colour="#b77bd8"><block type="esp32_serial_begin"></block><block type="esp32_serial_print"></block></category>
<category name="Network" colour="#d58a45"><block type="esp32_wifi"></block><block type="esp32_mqtt_publish"></block></category>
</xml>
<script>
if(!window.Blockly){document.getElementById('status').textContent='Blockly gagal dimuat. Periksa koneksi internet/CDN.';throw new Error('Blockly CDN unavailable');}
const defs=[
{type:'esp32_setup',message0:'when ESP32 starts (setup)',message1:'do %1',args1:[{type:'input_statement',name:'DO'}],colour:'#dca52f',tooltip:'Dijalankan sekali saat ESP32 mulai.'},
{type:'esp32_loop',message0:'forever (loop)',message1:'do %1',args1:[{type:'input_statement',name:'DO'}],colour:'#dca52f',tooltip:'Dijalankan berulang selama board aktif.'},
{type:'esp32_delay',message0:'wait %1 milliseconds',args0:[{type:'input_value',name:'MS',check:'Number'}],previousStatement:null,nextStatement:null,colour:'#dca52f'},
{type:'esp32_repeat',message0:'repeat %1 times',args0:[{type:'input_value',name:'TIMES',check:'Number'}],message1:'do %1',args1:[{type:'input_statement',name:'DO'}],previousStatement:null,nextStatement:null,colour:'#dca52f'},
{type:'esp32_if',message0:'if %1',args0:[{type:'input_value',name:'COND',check:'Boolean'}],message1:'then %1',args1:[{type:'input_statement',name:'DO'}],message2:'else %1',args2:[{type:'input_statement',name:'ELSE'}],previousStatement:null,nextStatement:null,colour:'#9b65c9'},
{type:'esp32_pinmode',message0:'set GPIO %1 as %2',args0:[{type:'input_value',name:'PIN',check:'Number'},{type:'field_dropdown',name:'MODE',options:[['OUTPUT','OUTPUT'],['INPUT','INPUT'],['INPUT_PULLUP','INPUT_PULLUP']]}],previousStatement:null,nextStatement:null,colour:'#4c9bdb'},
{type:'esp32_digital_write',message0:'set GPIO %1 to %2',args0:[{type:'input_value',name:'PIN',check:'Number'},{type:'field_dropdown',name:'STATE',options:[['HIGH','HIGH'],['LOW','LOW']]}],previousStatement:null,nextStatement:null,colour:'#4c9bdb'},
{type:'esp32_digital_read',message0:'read digital GPIO %1',args0:[{type:'input_value',name:'PIN',check:'Number'}],output:'Number',colour:'#4c9bdb'},
{type:'esp32_analog_read',message0:'read analog GPIO %1',args0:[{type:'input_value',name:'PIN',check:'Number'}],output:'Number',colour:'#48a66a'},
{type:'esp32_serial_begin',message0:'start Serial at %1 baud',args0:[{type:'field_number',name:'BAUD',value:115200,min:300}],previousStatement:null,nextStatement:null,colour:'#b77bd8'},
{type:'esp32_serial_print',message0:'Serial print %1',args0:[{type:'input_value',name:'TEXT'}],previousStatement:null,nextStatement:null,colour:'#b77bd8'},
{type:'esp32_wifi',message0:'connect Wi-Fi SSID %1 password %2',args0:[{type:'field_input',name:'SSID',text:'YOUR_WIFI'},{type:'field_input',name:'PASS',text:'YOUR_PASSWORD'}],previousStatement:null,nextStatement:null,colour:'#d58a45'},
{type:'esp32_mqtt_publish',message0:'MQTT publish topic %1 message %2',args0:[{type:'field_input',name:'TOPIC',text:'lab/esp32/status'},{type:'input_value',name:'MSG'}],previousStatement:null,nextStatement:null,colour:'#d58a45'}
];
Blockly.defineBlocksWithJsonArray(defs);
const workspace=Blockly.inject('blocklyDiv',{toolbox:document.getElementById('toolbox'),renderer:'zelos',grid:{spacing:20,length:3,colour:'#e5ebf4',snap:true},zoom:{controls:true,wheel:true,startScale:.9,maxScale:1.4,minScale:.55},trashcan:true,move:{scrollbars:true,drag:true, wheel:true},sounds:false});
function num(b,n,d){const t=b.getInputTargetBlock(n);return t?expr(t):d}
function expr(b){if(!b)return '0';switch(b.type){case'math_number':return b.getFieldValue('NUM');case'logic_boolean':return b.getFieldValue('BOOL')==='TRUE'?'true':'false';case'text':return JSON.stringify(b.getFieldValue('TEXT'));case'esp32_analog_read':return 'analogRead('+num(b,'PIN','34')+')';case'esp32_digital_read':return 'digitalRead('+num(b,'PIN','4')+')';case'math_arithmetic':{const op={'ADD':'+','MINUS':'-','MULTIPLY':'*','DIVIDE':'/','POWER':'^'}[b.getFieldValue('OP')]||'+';return '('+num(b,'A','0')+' '+op+' '+num(b,'B','0')+')'}case'logic_compare':return '('+num(b,'A','0')+' '+({'EQ':'==','NEQ':'!=','LT':'<','LTE':'<=','GT':'>','GTE':'>='}[b.getFieldValue('OP')]||'==')+' '+num(b,'B','0')+')';case'logic_operation':return '('+num(b,'A','false')+' '+(b.getFieldValue('OP')==='AND'?'&&':'||')+' '+num(b,'B','false')+')';case'variables_get':return b.getField('VAR').getVariable().name;default:return '0'}}
function stack(first,indent){let out='',b=first;while(b){const p='  '.repeat(indent);switch(b.type){case'esp32_delay':out+=p+'delay('+num(b,'MS','1000')+');\n';break;case'esp32_pinmode':out+=p+'pinMode('+num(b,'PIN','2')+', '+b.getFieldValue('MODE')+');\n';break;case'esp32_digital_write':out+=p+'digitalWrite('+num(b,'PIN','2')+', '+b.getFieldValue('STATE')+');\n';break;case'esp32_serial_begin':out+=p+'Serial.begin('+b.getFieldValue('BAUD')+');\n';break;case'esp32_serial_print':out+=p+'Serial.println('+num(b,'TEXT','"ESP32"')+');\n';break;case'esp32_wifi':out+=p+'WiFi.begin('+JSON.stringify(b.getFieldValue('SSID'))+', '+JSON.stringify(b.getFieldValue('PASS'))+');\n';break;case'esp32_mqtt_publish':out+=p+'// mqtt.publish('+JSON.stringify(b.getFieldValue('TOPIC'))+', '+num(b,'MSG','"message"')+');\n';break;case'esp32_repeat':out+=p+'for (int i = 0; i < '+num(b,'TIMES','5')+'; i++) {\n'+stack(b.getInputTargetBlock('DO'),indent+1)+p+'}\n';break;case'esp32_if':out+=p+'if ('+num(b,'COND','false')+') {\n'+stack(b.getInputTargetBlock('DO'),indent+1)+p+'} else {\n'+stack(b.getInputTargetBlock('ELSE'),indent+1)+p+'}\n';break;case'controls_if':out+=p+'if ('+num(b,'IF0','false')+') {\n'+stack(b.getInputTargetBlock('DO0'),indent+1)+p+'}\n';break;}b=b.getNextBlock()}return out}
function generate(){let setup=null,loop=null;workspace.getTopBlocks(true).forEach(b=>{if(b.type==='esp32_setup')setup=b;if(b.type==='esp32_loop')loop=b});let code='#include <Arduino.h>\n#include <WiFi.h>\n\nvoid setup() {\n'+(setup?stack(setup.getInputTargetBlock('DO'),1):'  Serial.begin(115200);\n')+'}\n\nvoid loop() {\n'+(loop?stack(loop.getInputTargetBlock('DO'),1):'  // Tambahkan blok ke dalam loop\n')+'}\n';document.getElementById('cpp').textContent=code;document.getElementById('genStatus').textContent=workspace.getAllBlocks(false).length+' blok';return code}
workspace.addChangeListener(e=>{if(e.isUiEvent)return;generate();});
function addBlock(type,fields){const b=workspace.newBlock(type);if(fields)Object.keys(fields).forEach(k=>b.setFieldValue(fields[k],k));b.initSvg();b.render();return b}
function connect(parent,input,child){parent.getInput(input).connection.connect(child.previousConnection)}
function example(){workspace.clear();const s=addBlock('esp32_setup'),l=addBlock('esp32_loop');s.moveBy(50,40);l.moveBy(50,260);connect(s,'DO',addBlock('esp32_pinmode',{MODE:'OUTPUT'}));const p=s.getInputTargetBlock('DO');p.getInput('PIN').connection.connect(addBlock('math_number',{NUM:2}).outputConnection);const w1=addBlock('esp32_digital_write',{STATE:'HIGH'});w1.getInput('PIN').connection.connect(addBlock('math_number',{NUM:2}).outputConnection);connect(l,'DO',w1);const d1=addBlock('esp32_delay');d1.getInput('MS').connection.connect(addBlock('math_number',{NUM:500}).outputConnection);w1.nextConnection.connect(d1.previousConnection);const w2=addBlock('esp32_digital_write',{STATE:'LOW'});w2.getInput('PIN').connection.connect(addBlock('math_number',{NUM:2}).outputConnection);d1.nextConnection.connect(w2.previousConnection);const d2=addBlock('esp32_delay');d2.getInput('MS').connection.connect(addBlock('math_number',{NUM:500}).outputConnection);w2.nextConnection.connect(d2.previousConnection);generate()}
document.getElementById('example').onclick=example;document.getElementById('reset').onclick=()=>{workspace.clear();generate();document.getElementById('led').classList.remove('on');document.getElementById('boardState').textContent='LED OFF'};
let sim=null,simOn=false;function run(){stop();const code=generate();if(!/digitalWrite/.test(code)){document.getElementById('status').textContent='Tambahkan blok digitalWrite untuk simulasi LED';return}simOn=true;let on=false;let n=0;document.getElementById('status').textContent='Simulasi berjalan (visual)';function tick(){if(!simOn)return;on=!on;document.getElementById('led').classList.toggle('on',on);document.getElementById('boardState').textContent=on?'LED ON':'LED OFF';document.getElementById('stageCaption').textContent='GPIO 2 → '+(on?'HIGH':'LOW')+' · simulasi pola Blink';n++;sim=setTimeout(tick,500)}tick()}function stop(){simOn=false;if(sim)clearTimeout(sim);document.getElementById('status').textContent='Simulasi dihentikan'}document.getElementById('run').onclick=run;document.getElementById('stop').onclick=stop;
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(generate()).then(()=>document.getElementById('status').textContent='Kode disalin');document.getElementById('download').onclick=()=>{const blob=new Blob([generate()],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='esp32_visual_program.ino';a.click();URL.revokeObjectURL(a.href)};
example();
</script></body></html>
